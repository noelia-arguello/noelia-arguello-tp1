<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Noelia Argüello</title>
        <link rel="stylesheet" href="estilos.css">
        <link rel="icon" type="image/svg+xml" href="img/svg/logo-favicon.svg">
    </head>
    
    <body>
        <header>
            <nav>
                <a href="index.html"><img src="img/svg/casa-inicio-escritorio.svg" alt="Ícono de casa" width="34" height="34"></a>
                <a href="sobre-mi.html">Sobre mí</a>
                <a href="#">Diseños</a>
                <a href="#">Ilustraciones</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>
        
        <main class="main-contacto">
            <section class="contacto">
                <h1>Contacto</h1>
                <form method="post" action="" target="_blank" enctype="text/plain">
                    <label for="nombre">* Nombre</label>
                    <input type="text" name="Nombre" id="Nombre" maxlength="30" placeholder="Nombre completo" required>
                    <label for="Email">* Email</label>
                    <input type="email" name="Email" id="Email" required >
                    <label for="Telefono">Teléfono</label>
                    <input type="tel" name="Telefono" id="Telefono" placeholder="(000)0000000000">
                    <label for="mensaje">Mensaje</label>
                    <textarea name="Mensaje" id="Mensaje" maxlength="600"></textarea>
                </form>
            </section>
            <section class="intereses">
                <h2>Intereses</h2>
                <form method="post" action="mailto:arguello.noelia.93@gmail.com?subject='Email enviado desde el formulario'" target="blank" enctype="text/plain">
                    <label>Diseño web <input type="checkbox" name="intereses" value="Diseño web" id="Diseño web"></label>
                    <label>Packaging <input type="checkbox" name="intereses" value="Packaging" id="Packaging"></label>
                    <label>Diseño editorial <input type="checkbox" name="intereses" value="Diseño editorial" id="Diseño editorial"></label>
                    <label>Diseño de pósters <input type="checkbox" name="intereses" value="Diseño de pósters" id="Diseño de pósters"></label>
                    <label>Diseño identitário <input type="checkbox" name="intereses" value="Diseño identitário" id="Diseño identitário"></label>
                    <label>Diseño de logotipo <input type="checkbox" name="intereses" value="Diseño de logotipo" id="Diseño de logotipo"></label>
                    <label>Ilustración <input type="checkbox" name="intereses" value="Ilustración" id="Ilustración"></label>
                </form>
            </section>
            <section class="botones">
                <img src="img/svg/logo-gris-oscuro.svg" alt="Logo oscuro" width="238" height="270">
                <form method="post" target="blank" enctype="text/plain">
                    <input type="reset" value="borrar">
                    <input type="submit" value="Enviar" formenctype="multipart/form-data">
                </form>
            </section>
        </main>
        
        <footer>
            <small>Todos los derechos reservados© 2026</small>
            <ul>
                <li>
                    <img src="img/svg/behance-escritorio.svg" alt="Logo Behance" width="26" height="26"/>
                    <a href="https://www.behance.net/noeliaargello">Behance</a>
                </li>
                <li>
                    <img src="img/svg/instagram-escritorio.svg" alt="Logo Instagram" width="26" height="26"/>
                    <a href="https://www.instagram.com/noeliaarguello.dg?igsh=MXJ6Z2l2c2hoY2hsZg==">Instagram</a>
                </li>
                <img src="img/svg/logo-lavanda-escritorio.svg" alt="Logo pequeño" width="63" height="73"/>
            </ul>
        </footer>
    </body>
</html>
